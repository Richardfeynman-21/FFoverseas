<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <!-- Solid White Background for absolute contrast and visibility across all apps -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- ==================== LAYER 1: "FF" LETTERS ==================== -->
  <!-- Left "F" Letter Path -->
  <path d="M -35,70 
           L 35,70 
           L 35,56 
           Q 14,56 14,42 
           L 14,8 
           L 48,8 
           L 48,-8 
           L 14,-8 
           L 14,-52 
           Q 14,-62 25,-62 
           L 62,-62 
           L 62,-44 
           L 70,-44 
           L 70,-74 
           L -35,-74 
           L -35,-60 
           Q -14,-60 -14,-46 
           L -14,42 
           Q -14,56 -35,56 
           Z" 
        fill="#0F3C7A" 
        transform="translate(195, 180)" />

  <!-- Right "F" Letter Path -->
  <path d="M -35,70 
           L 35,70 
           L 35,56 
           Q 14,56 14,42 
           L 14,8 
           L 48,8 
           L 48,-8 
           L 14,-8 
           L 14,-52 
           Q 14,-62 25,-62 
           L 62,-62 
           L 62,-44 
           L 70,-44 
           L 70,-74 
           L -35,-74 
           L -35,-60 
           Q -14,-60 -14,-46 
           L -14,42 
           Q -14,56 -35,56 
           Z" 
        fill="#0F3C7A" 
        transform="translate(305, 180)" />

  <!-- ==================== LAYER 2: GRADUATION CAP ==================== -->
  <!-- Mounted precisely on the top-left corner of the first F -->
  <g id="grad-cap" transform="translate(156, 103) rotate(-11)">
    <!-- Cap Base Shadow -->
    <path d="M -15,5 L -15,16 C -15,23 15,23 15,16 L 15,5 Z" fill="#111111" />
    <!-- Cap Base Outer Border -->
    <path d="M -15,5 L -15,16 C -15,23 15,23 15,16 L 15,5 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Diamond Top -->
    <polygon points="-32,0 0,-15 32,0 0,15" fill="#111111" stroke="#FFFFFF" stroke-width="1.8" />
    <!-- Inner Accent for Depth -->
    <polygon points="-27,0 0,-12 27,0 0,12" fill="#2E2E2E" />
    <!-- Tassel -->
    <path d="M 0,0 Q 18,3 20,18" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="20" cy="18" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- ==================== LAYER 3: WHITE TEAR CUTTER ==================== -->
  <!-- 
    An expanded duplicate of the red swoosh (stroke-width 16) 
    that cuts a clean white gap directly through the blue F's.
  -->
  <path d="M 150,180 
           C 180,184 230,186 290,176 
           C 340,166 385,145 415,125 
           C 365,165 300,198 235,212 
           C 185,222 155,210 150,180 
           Z" 
        fill="#FFFFFF" 
        stroke="#FFFFFF" 
        stroke-width="16" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- ==================== LAYER 4: TAPERED RED SWOOSH ==================== -->
  <!-- Starts broad on the left stem of the first F, tapering cleanly to the right tip -->
  <path d="M 150,180 
           C 180,184 230,186 290,176 
           C 340,166 385,145 415,125 
           C 365,165 300,198 235,212 
           C 185,222 155,210 150,180 
           Z" 
        fill="#D32F2F" 
        stroke="#D32F2F" 
        stroke-width="2" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- ==================== LAYER 5: ALIGNED FORWARD AIRPLANE ==================== -->
  <!-- Centered perfectly at the tip (415, 125) and rotated (-35deg) along the path tangent -->
  <g transform="translate(415, 125) rotate(-35)">
    <path d="M 12,0 
             L 2,-3 
             L -4,-3 
             L -10,-11 
             L -13,-11 
             L -8,-3 
             L -14,-3 
             L -17,-6 
             L -19,-6 
             L -18,0 
             L -19,6 
             L -17,6 
             L -14,3 
             L -8,3 
             L -13,11 
             L -10,11 
             L -4,3 
             L 2,3 
             Z" 
          fill="#111111" />
  </g>
</svg>